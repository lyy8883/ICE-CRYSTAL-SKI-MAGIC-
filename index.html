<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>夢幻冰雪滑雪學院</title>
<style>
:root{--ice:#dff7ff;--mint:#dff8ed;--lav:#eee5ff;--blue:#6cbbdf;--purple:#9d86d9;--ink:#30465d;--white:#ffffffd9}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#fff 0,transparent 25%),linear-gradient(145deg,#d9f5ff,#e4fff0 48%,#eee2ff);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#fff 1.5px,transparent 1.5px);background-size:25px 25px}
.wrap{max-width:1050px;margin:auto;padding:20px 15px 45px;position:relative}.hero{padding:25px 20px;border:1px solid #ffffffc9;background:#ffffffa8;border-radius:28px;text-align:center;box-shadow:0 10px 35px #7caacb25}
.kicker{letter-spacing:3px;font-size:11px;color:#7799b2;font-weight:800}.hero h1{font-size:clamp(25px,5vw,42px);margin:8px 0;color:#557eaa}.hero p{margin:5px 0}.snow{font-size:22px}
.profiles{display:flex;justify-content:center;gap:10px;margin:18px 0 5px;flex-wrap:wrap}.profile{border:2px solid transparent;border-radius:18px;padding:11px 18px;background:#ffffffb8;color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}.profile.active{border-color:#77c8e8;background:#e9faff;box-shadow:0 5px 15px #80c9e633}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#ffffffad;border-radius:17px;padding:12px;text-align:center;border:1px solid white}.stat strong{display:block;font-size:23px;color:#6c9fc2}.stat span{font-size:12px}
h2{font-size:19px;margin:23px 2px 12px;color:#557eaa}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:1px solid #fff;background:linear-gradient(145deg,#ffffffdf,#f4fbffb8);border-radius:20px;padding:17px 13px;text-align:left;cursor:pointer;min-height:130px;color:var(--ink);box-shadow:0 6px 18px #8ab7ce19;transition:.15s}.tile:hover,.tile:focus{transform:translateY(-2px);box-shadow:0 10px 22px #8ab7ce35;outline:2px solid #b4e8f8}.tile .icon{font-size:27px}.tile strong{display:block;margin:8px 0 4px;font-size:15px}.tile small{line-height:1.5;color:#71879b;font-size:12px}
.panel{margin-top:17px;padding:20px;background:#ffffffd9;border:1px solid white;border-radius:23px;box-shadow:0 8px 28px #87b5ce22;display:none}.panel.open{display:block}.panel h2{margin:0 0 14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field,textarea,select{border:1px solid #cfe6ef;border-radius:12px;padding:10px 12px;background:#fbfeff;color:var(--ink);font:inherit;max-width:100%}textarea{width:100%;min-height:85px;resize:vertical}.btn{border:0;border-radius:12px;padding:10px 14px;background:#d9f3ff;color:#426d8b;font-weight:800;cursor:pointer}.btn.alt{background:#eee6ff;color:#6b5a99}.btn.mint{background:#ddf8e9;color:#467e69}.list{display:grid;gap:9px}.item{background:#f6fbff;border:1px solid #e3f1f7;border-radius:13px;padding:11px}.item label{display:flex;gap:9px;align-items:flex-start}.item input[type=checkbox]{accent-color:#71bce0;width:18px;height:18px;margin-top:2px}.muted{color:#7890a3;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0eaff;color:#7968a9;font-size:12px;margin:3px}.progress{height:9px;background:#e7f2f7;border-radius:20px;overflow:hidden;margin:9px 0}.progress div{height:100%;background:linear-gradient(90deg,#8dd9ee,#b8ead2,#c8b6f5);width:0}
.footer{text-align:center;color:#8097a9;font-size:12px;margin-top:22px}
@media(max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:128px;padding:14px 11px}.stats{gap:7px}.stat{padding:10px 4px}.stat strong{font-size:20px}}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.hero{padding:20px 12px}}
.wrap:after{content:"🐰  🎀  ♡  🦋  ♡  🐻‍❄️";display:block;text-align:center;letter-spacing:10px;font-size:20px;opacity:.8;padding-top:14px;pointer-events:none}.tile:after{content:"♡";float:right;color:#e6a9d3}.panel:after{content:"🐾  🎀  🦋  ♡";display:block;text-align:right;font-size:17px;letter-spacing:7px;opacity:.8;margin-top:14px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}.day-cell{min-height:70px;border:1px solid #d6eaf5;border-radius:12px;background:#f8fdff;padding:5px 2px;color:var(--ink);cursor:pointer;font-size:12px}.day-cell.selected{outline:3px solid #9ddcf0;background:#e8faff}.day-cell .mark{display:block;font-size:10px;color:#6888a2;margin-top:4px}.day-head{text-align:center;font-size:11px;font-weight:800}.spinwheel{width:min(290px,75vw);aspect-ratio:1;border-radius:50%;margin:12px auto;background:conic-gradient(#bdeaff 0 45deg,#f2e4ff 45deg 90deg,#d8f6e8 90deg 135deg,#fff0cf 135deg 180deg,#d7edff 180deg 225deg,#f8dff0 225deg 270deg,#dff8f2 270deg 315deg,#e8e0ff 315deg);border:8px solid #fff;box-shadow:0 5px 20px #8ab7ce55;display:flex;align-items:center;justify-content:center;font-size:40px;transition:transform 3s cubic-bezier(.15,.7,.1,1)}.shop-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.shop-item{background:#f7fcff;border:1px solid #dceef5;border-radius:12px;padding:10px 5px;text-align:center;cursor:pointer;color:var(--ink);min-height:78px}.shop-item span{display:block;font-size:24px}.shop-item small{display:block;font-size:11px}@media(max-width:580px){.shop-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.day-cell{min-height:60px}} </style>
</head>
<body><main class="wrap">
<header class="hero"><div class="snow">❄️ ✧ 🩵 ✧ 💜 ✧ ❄️</div><div class="kicker">ICE CRYSTAL · SKI MAGIC</div><h1>夢幻冰雪滑雪學院</h1><p>小藍 × 小優的專屬滑雪世界</p><p class="muted">為滑雪旅行做準備・安全練習・每天一點點進步</p><div class="profiles"><button class="profile active" data-profile="小藍">🩵 小藍</button><button class="profile" data-profile="小優">💜 小優</button></div></header>
<section class="stats"><div class="stat"><strong id="stars">0 ⭐</strong><span>我的星星</span></div><div class="stat"><strong id="done">0/0</strong><span>今日完成</span></div><div class="stat"><strong id="days">0</strong><span>日記篇數</span></div></section>
<h2>🏰 魔法功能大廳</h2>
<section class="grid" id="tiles">
<button class="tile" data-page="today"><span class="icon">📅</span><strong>今日課表</strong><small>完成勾選・加強目標・每日回顧</small></button>
<button class="tile" data-page="calendar"><span class="icon">🗓️</span><strong>魔法行事曆</strong><small>安排訓練、休息與出發準備</small></button>
<button class="tile" data-page="academy"><span class="icon">🎿</span><strong>滑雪學院</strong><small>裝備、雪道安全、滑雪知識</small></button>
<button class="tile" data-page="fitness"><span class="icon">🧊</span><strong>冰雪體能室</strong><small>基礎平衡、腿部力量與協調</small></button>
<button class="tile" data-page="quiz"><span class="icon">🎮</span><strong>冰晶挑戰</strong><small>答題累積星星</small></button>
<button class="tile" data-page="diary"><span class="icon">📔</span><strong>成長日記與報告</strong><small>新增日記、查看成長紀錄</small></button>
<button class="tile" data-page="archive"><span class="icon">🗂️</span><strong>日誌、成長日記與報告保存區</strong><small>集中查看已保存的情報、進度、日記與報告</small></button>
<button class="tile" data-page="quest"><span class="icon">🎡</span><strong>任務轉盤與闖關</strong><small>抽取任務、解鎖徽章</small></button>
<button class="tile" data-page="garden"><span class="icon">⭐</span><strong>⭐ 星星收藏屋・250 件收藏</strong><small>250 種滑雪主題收藏品＋收藏寶箱</small></button>
<button class="tile" data-page="spy"><span class="icon">🛰️</span><strong>滑雪冷戰間諜營</strong><small>小藍×小優 vs 爸爸媽媽・情報日誌與競賽進度</small></button>
<button class="tile" data-page="backup"><span class="icon">💾</span><strong>備份與還原</strong><small>保存與還原訓練紀錄</small></button>
</section>
<section class="panel" id="panel"><div id="panelContent"></div></section>
<div class="footer">❄️ 每個人的紀錄分開保存於這個瀏覽器。訓練以安全、適量為原則；滑雪技巧請跟隨合格教練。 ❄️</div>
</main>
<script>
const KEY='iceSkiAcademy_v2';
const initial=()=>({stars:0,tasks:{},extra:'',review:'',events:[],diary:[],decor:[],badges:[],quizDone:[],intel:[],teamProgress:{kids:'',parents:''},calendarNotes:{},quizSeen:[]});
let data={};try{data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('iceSkiAcademy_v1')||'{}')}catch(e){data={}}
function ensure(n){if(!data[n])data[n]=initial();return data[n]}
let current='小藍',page='today';
const today=()=>new Date().toISOString().slice(0,10);
const taskSets={today:['活動前暖身 5 分鐘','單腳平衡（左右輪流，靠近穩固支撐物）','椅子坐站 8 次，動作平穩','左右側步與協調練習 1 分鐘','複習一項雪道安全知識','補充水分並記錄今天狀態'],fitness:['原地踏步 1 分鐘','扶著穩固椅背練習單腳平衡，每側 15 秒','椅子坐站 6–8 次','左右側步 30 秒','小腿與大腿輕柔伸展','休息並喝水']};
const content=document.getElementById('panelContent');
function save(silent=false){try{localStorage.setItem(KEY,JSON.stringify(data));renderStats();const status=document.getElementById('saveStatus');if(status)status.textContent='✓ 已保存到此裝置';return true}catch(e){if(!silent)alert('此瀏覽器無法保存資料，請使用「備份與還原」匯出紀錄。');return false}}
function prof(){return ensure(current)}
function renderStats(){const p=prof(),tasks=taskSets.today,done=tasks.filter((_,i)=>p.tasks[today()+'_'+i]).length;document.getElementById('stars').textContent=p.stars+' ⭐';document.getElementById('done').textContent=done+'/'+tasks.length;document.getElementById('days').textContent=p.diary.length}
function openPage(p){page=p;document.getElementById('panel').classList.add('open');const titles={today:'📅 今日課表',calendar:'🗓️ 魔法行事曆',academy:'🎿 滑雪學院',fitness:'🧊 冰雪體能室',quiz:'🎮 冰晶挑戰',diary:'📔 成長日記與報告',archive:'🗂️ 日誌、成長日記與報告保存區',quest:'🎡 夢幻任務轉盤與闖關',garden:'⭐ 星星收藏屋與收藏寶箱',spy:'🛰️ 滑雪冷戰間諜營',backup:'💾 備份與還原'};let h='<h2>'+titles[p]+'</h2>';
if(p==='today'){h+='<p class="muted">'+today()+' · 完成一項就勾選一項，按保存後會記錄星星。</p><div class="list">'+taskSets.today.map((t,i)=>'<div class="item"><label><input type="checkbox" data-task="'+i+'" '+(prof().tasks[today()+'_'+i]?'checked':'')+'><span>'+t+'</span></label></div>').join('')+'</div><h3>✍️ 自由輸入加強目標</h3><textarea id="extra" placeholder="例如：複習雪道標誌、整理滑雪裝備……">'+esc(prof().extra)+'</textarea><h3>🌙 每日回顧</h3><textarea id="review" placeholder="今天完成了什麼？感覺如何？明天想做什麼？">'+esc(prof().review)+'</textarea><p><button class="btn" id="saveToday">保存今日紀錄</button></p>'}
if(p==='calendar'){h+='<p>安排訓練、休息與出發準備。</p><div class="row"><input class="field" id="eventDate" type="date" value="'+today()+'"><select id="eventType" class="field"><option>訓練</option><option>休息</option><option>出發準備</option><option>滑雪日</option></select><input class="field" id="eventText" placeholder="活動內容"></div><p><button class="btn" id="addEvent">＋ 加入行事曆</button></p><div class="list">'+(prof().events.map((e,i)=>'<div class="item">📌 <b>'+esc(e.date)+'</b> · '+esc(e.type)+'：'+esc(e.text)+' <button class="btn alt" data-del-event="'+i+'">刪除</button></div>').join('')||'<p class="muted">還沒有安排，新增第一個行程吧。</p>')+'</div>'}
if(p==='academy'){h+='<div class="list"><div class="item"><b>🎿 裝備檢查</b><p>合適尺寸的滑雪板／雪鞋由租借店或教練協助確認；戴好頭盔、護目鏡與手套，穿著保暖分層衣物。</p></div><div class="item"><b>🚦 雪道安全</b><p>初學者留在教練指定的初級區。出發前先看上方與周圍；不要停在視線死角；遵守雪道標示並聽從教練指示。</p></div><div class="item"><b>🧊 上課前記住</b><p>先學如何安全停下、控制速度與起身，再依教練安排進階。疲累、疼痛或天候變差時，告知大人並休息。</p></div><div class="item"><b>🎒 出發清單</b><p>雪衣雪褲、保暖中層、手套、護目鏡、頭盔、厚滑雪襪、防曬、飲水、替換衣物。</p></div></div>'}
if(p==='fitness'){h+='<p class="muted">每次約 5–10 分鐘即可。選擇平穩、防滑的地面；不舒服就停止。不要在床上或不穩固的家具上練習。</p><div class="list">'+taskSets.fitness.map((t,i)=>'<div class="item"><label><input type="checkbox" data-fit="'+i+'" '+(prof().tasks['fit_'+today()+'_'+i]?'checked':'')+'><span>'+t+'</span></label></div>').join('')+'</div><p><button class="btn mint" id="saveFit">保存體能紀錄</button></p>'}
if(p==='quiz'){const qs=[{q:'初學者應該在哪裡練習？',a:['教練指定的初級區','任何陡坡'],ok:0,why:'初級區更適合練習，並遵循教練指示。'},{q:'滑雪時最重要的裝備之一是？',a:['安全頭盔','一般棒球帽'],ok:0,why:'滑雪時應配戴合適的滑雪頭盔。'},{q:'如果感到疼痛或非常疲累，應該？',a:['告訴大人／教練並休息','硬撐完成所有練習'],ok:0,why:'身體不適時應停止並告知大人或教練。'},{q:'停下休息時應該？',a:['選擇不妨礙他人的安全位置','停在坡道正中間'],ok:0,why:'選擇看得見、且不阻礙其他滑雪者的位置。'}];let idx=prof().quizIndex||0;let q=qs[idx%qs.length];h+='<span class="badge">第 '+(idx%qs.length+1)+' 題 / '+qs.length+'</span><div class="item"><b>'+q.q+'</b></div><div class="list">'+q.a.map((a,i)=>'<button class="tile" style="min-height:auto" data-answer="'+i+'">'+(i===0?'A':'B')+' · '+a+'</button>').join('')+'</div><div id="quizMsg" class="muted"></div>'}
if(p==='diary'){h+='<p class="muted">記錄感受與努力，不需要和別人比較。</p><input class="field" id="diaryTitle" placeholder="今天的小標題"><textarea id="diaryText" placeholder="今天我學到了……我最滿意的是……下一步想試試……"></textarea><p><button class="btn" id="addDiary">📔 保存日記</button></p><h3>我的成長紀錄</h3><div class="list">'+(prof().diary.map(d=>'<div class="item"><b>'+esc(d.date)+' · '+esc(d.title||'今日紀錄')+'</b><p>'+esc(d.text)+'</p></div>').reverse().join('')||'<p class="muted">還沒有日記，寫下第一篇吧。</p>')+'</div><h3>📊 小報告</h3><p>星星：'+prof().stars+' ⭐　日記：'+prof().diary.length+' 篇　行程：'+prof().events.length+' 項</p>'}
if(p==='archive'){const all=[];['小藍','小優'].forEach(name=>{const x=ensure(name);(x.intel||[]).forEach(v=>all.push({date:v.date||'',who:name,kind:'🛰️ 情報日誌',title:(v.team==='parents'?'爸爸媽媽隊':'小藍＋小優隊')+' · '+(v.type||''),text:v.note||'',source:v.source||''}));(x.diary||[]).forEach(v=>all.push({date:v.date||'',who:name,kind:'📔 成長日記',title:v.title||'今日紀錄',text:v.text||'',source:''}));const tp=x.teamProgress||{};if((tp.kids||'').trim())all.push({date:'',who:name,kind:'🏁 隊伍進度',title:'小藍＋小優隊準備進度',text:tp.kids,source:'自由填寫'});if((tp.parents||'').trim())all.push({date:'',who:name,kind:'🏁 隊伍進度',title:'爸爸＋媽媽隊準備進度',text:tp.parents,source:'自由填寫'});if((x.review||'').trim())all.push({date:today(),who:name,kind:'🌙 每日回顧',title:'今日課表回顧',text:x.review,source:''});});all.sort((a,b)=>b.date.localeCompare(a.date));h+='<p class="muted">這裡集中顯示兩個個人檔案中已保存的情報日誌、隊伍進度、成長日記與每日回顧。資料保存在目前瀏覽器；建議定期到「備份與還原」匯出備份。</p><div class="row"><button class="btn" id="archiveExport">⬇️ 匯出保存區紀錄</button><button class="btn alt" id="archiveRefresh">↻ 重新整理</button></div><h3>📚 已保存紀錄（'+all.length+'）</h3><div class="list">'+(all.map(v=>'<div class="item"><span class="badge">'+esc(v.kind)+'</span><span class="badge">'+esc(v.who)+'</span><b>'+esc(v.date||'進度紀錄')+' · '+esc(v.title)+'</b><p style="white-space:pre-wrap">'+esc(v.text)+'</p>'+(v.source?'<small>來源：'+esc(v.source)+'</small>':'')+'</div>').join('')||'<p class="muted">目前沒有已保存紀錄。請先在「滑雪冷戰間諜營」或「成長日記與報告」新增內容，再回來查看。</p>')+'</div>'}
if(p==='quest'){h+='<div class="item" style="text-align:center;padding:25px"><div style="font-size:44px">🎡</div><h3 id="questText">準備好抽取今天的冰雪任務了嗎？</h3><button class="btn alt" id="spin">✨ 抽取任務</button></div><h3>🏅 已解鎖徽章</h3><div>'+(prof().badges.map(b=>'<span class="badge">'+esc(b)+'</span>').join('')||'<span class="muted">完成任務來解鎖徽章！</span>')+'</div><p><button class="btn mint" id="completeQuest">完成任務＋獲得 1 顆星</button></p>'}
if(p==='garden'){const items=[['❄️','冰晶雪花',3],['🌲','薄荷雪松',5],['🏰','冰雪城堡',10],['🦋','極光蝴蝶',7],['🌙','月光小屋',8],['🌈','極光彩虹',12]];h+='<p>目前星星：<b>'+prof().stars+' ⭐</b>。挑選裝飾兌換，已收藏的裝飾會顯示在下方。</p><div class="grid">'+items.map(([ico,name,cost])=>'<button class="tile" style="min-height:105px" data-decor="'+name+'" data-cost="'+cost+'"><span class="icon">'+ico+'</span><strong>'+name+'</strong><small>'+cost+' ⭐</small></button>').join('')+'</div><h3>'+esc(prof().gardenName)+'</h3><div style="font-size:28px;line-height:1.8">'+(prof().decor.map(x=>x.split('|')[0]).join(' ')||'❄️ 🩵 ❄️')+'</div><p>'+prof().decor.map(x=>'<span class="badge">'+esc(x.split('|')[1])+'</span>').join(' ')+'</p>'}
